name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, back up, and restore image
        run: |
          docker build -t override-game:verify .
          docker volume create override-verify-data
          trap 'docker rm -f override-verify >/dev/null 2>&1 || true; docker volume rm override-verify-data >/dev/null 2>&1 || true' EXIT
          wait_for_health() {
            for attempt in {1..30}; do
              if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then return 0; fi
              sleep 1
            done
            docker logs override-verify
            return 1
          }
          docker run -d --name override-verify -p 8787:8787 -v override-verify-data:/data -e PUBLIC_ORIGIN=https://game.example -e FIREBASE_WEB_CONFIG='{"apiKey":"ci","authDomain":"ci.firebaseapp.com","projectId":"ci","appId":"ci"}' -e FIREBASE_SERVICE_ACCOUNT_JSON='{"project_id":"ci","client_email":"ci@example.iam.gserviceaccount.com","private_key":"-----BEGIN PRIVATE KEY-----\nCI\n-----END PRIVATE KEY-----\n"}' -e INVITATION_ENCRYPTION_KEY=ci-only-test-key override-game:verify
          wait_for_health
          docker exec override-verify test -f /data/override.sqlite
          curl -fsS http://127.0.0.1:8787/api/session >/dev/null
          match_id=$(docker exec override-verify npm run backup:fixture | tail -n 1)
          docker exec override-verify npm run backup:db -- /data/backups/ci-backup.sqlite
          docker rm -f override-verify
          docker run --rm -v override-verify-data:/data --entrypoint node override-game:verify -e "require('node:fs').copyFileSync('/data/backups/ci-backup.sqlite', '/data/restore.sqlite')"
          docker run -d --name override-verify -p 8787:8787 -v override-verify-data:/data -e PUBLIC_ORIGIN=https://game.example -e FIREBASE_WEB_CONFIG='{"apiKey":"ci","authDomain":"ci.firebaseapp.com","projectId":"ci","appId":"ci"}' -e FIREBASE_SERVICE_ACCOUNT_JSON='{"project_id":"ci","client_email":"ci@example.iam.gserviceaccount.com","private_key":"-----BEGIN PRIVATE KEY-----\nCI\n-----END PRIVATE KEY-----\n"}' -e INVITATION_ENCRYPTION_KEY=ci-only-test-key -e DB_PATH=/data/restore.sqlite override-game:verify
          wait_for_health
          docker exec override-verify node -e "const Database = require('better-sqlite3'); const db = new Database('/data/restore.sqlite'); const count = db.prepare('SELECT COUNT(*) AS count FROM sessions').get().count; db.close(); if (count !== 1) process.exit(1)"
          docker exec override-verify npm run backup:verify -- "$match_id"
